<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Merliah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <h1>MERLIAH</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="products.html" class="active">Productos</a></li>
                <li><a href="#nuevo">Nuevo</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
            </ul>
            <div class="nav-icons">
                <div class="search-box">
                    <input type="text" placeholder="Buscar productos...">
                    <button class="search-btn"></button>
                </div>
                <a href="cart.html" class="cart-icon"></a>
                <a href="login.html" class="user-icon"></a>
            </div>
        </nav>
    </header>

    <main class="products-main">
        <div class="filters-sidebar">
            <h3>Filtros</h3>
            <div class="filter-group">
                <h4>Categoría</h4>
                <label><input type="checkbox" checked> Vestidos</label>
                <label><input type="checkbox" checked> Bañadores</label>
                <label><input type="checkbox" checked> Camisas</label>
                <label><input type="checkbox" checked> Shorts</label>
            </div>
            <div class="filter-group">
                <h4>Precio</h4>
                <input type="range" min="0" max="100" value="50">
            </div>
            <div class="filter-group">
                <h4>Talla</h4>
                <label><input type="checkbox"> XS</label>
                <label><input type="checkbox"> S</label>
                <label><input type="checkbox" checked> M</label>
                <label><input type="checkbox"> L</label>
                <label><input type="checkbox"> XL</label>
            </div>
        </div>

        <div class="products-container">
            <div class="products-header">
                <h2>Todos los Productos</h2>
                <select class="sort-select">
                    <option>Ordenar por: Destacados</option>
                    <option>Precio: Menor a Mayor</option>
                    <option>Precio: Mayor a Menor</option>
                    <option>Novedades</option>
                </select>
            </div>

            <div class="products-grid detailed">
                <!-- Producto 1 -->
                <div class="product-card">
                    <img src="images/products/default.jpg" alt="Vestido Floral">
                    <h3>Vestido Floral Azul</h3>
                    <p class="price">€29.99</p>
                    <button class="add-to-cart">Añadir al Carrito</button>
                </div>
                
                <!-- Producto 2 -->
                <div class="product-card">
                    <img src="images/products/default.jpg" alt="Bañador">
                    <h3>Bañador Marino</h3>
                    <p class="price">€24.99</p>
                    <button class="add-to-cart">Añadir al Carrito</button>
                </div>
                
                <!-- Producto 3 -->
                <div class="product-card">
                    <img src="images/products/default.jpg" alt="Camisa">
                    <h3>Camisa de Lino</h3>
                    <p class="price">€34.99</p>
                    <button class="add-to-cart">Añadir al Carrito</button>
                </div>
                
                <!-- Producto 4 -->
                <div class="product-card">
                    <img src="images/products/default.jpg" alt="Shorts">
                    <h3>Shorts Vaquero</h3>
                    <p class="price">€22.99</p>
                    <button class="add-to-cart">Añadir al Carrito</button>
                </div>
                
                <!-- Producto 5 -->
                <div class="product-card">
                    <img src="images/products/default.jpg" alt="Vestido">
                    <h3>Vestido Largo</h3>
                    <p class="price">€39.99</p>
                    <button class="add-to-cart">Añadir al Carrito</button>
                </div>
                
                <!-- Producto 6 -->
                <div class="product-card">
                    <img src="images/products/default.jpg" alt="Bikini">
                    <h3>Bikini Estampado</h3>
                    <p class="price">€19.99</p>
                    <button class="add-to-cart">Añadir al Carrito</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
