<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Merliah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <h1>MERLIAH</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="products.html">Productos</a></li>
                <li><a href="#nuevo">Nuevo</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
            </ul>
            <div class="nav-icons">
                <div class="search-box">
                    <input type="text" placeholder="Buscar productos...">
                    <button class="search-btn">🔍</button>
                </div>
                <a href="cart.html" class="cart-icon active">🛒</a>
                <a href="login.html" class="user-icon">👤</a>
            </div>
        </nav>
    </header>

    <main class="cart-main">
        <h2>Tu Carrito de Compra</h2>
        
        <div class="cart-container">
            <div class="cart-items">
                <div class="cart-item">
                    <img src="images/products/default.jpg" alt="Vestido Floral">
                    <div class="item-details">
                        <h3>Vestido Floral Veraniego</h3>
                        <p>Talla: S</p>
                        <p class="price">€29.99</p>
                    </div>
                    <div class="item-controls">
                        <div class="quantity-controls">
                            <button class="qty-btn">-</button>
                            <span class="quantity">1</span>
                            <button class="qty-btn">+</button>
                        </div>
                        <button class="remove-btn">Eliminar</button>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="images/products/default.jpg" alt="Bañador">
                    <div class="item-details">
                        <h3>Bañador Azul Marino</h3>
                        <p>Talla: M</p>
                        <p class="price">€24.99</p>
                    </div>
                    <div class="item-controls">
                        <div class="quantity-controls">
                            <button class="qty-btn">-</button>
                            <span class="quantity">1</span>
                            <button class="qty-btn">+</button>
                        </div>
                        <button class="remove-btn">Eliminar</button>
                    </div>
                </div>
            </div>

            <div class="cart-summary">
                <h3>Resumen del Pedido</h3>
                <div class="summary-line">
                    <span>Subtotal:</span>
                    <span>€54.98</span>
                </div>
                <div class="summary-line">
                    <span>Envío:</span>
                    <span>€4.99</span>
                </div>
                <div class="summary-line total">
                    <span>Total:</span>
                    <span>€59.97</span>
                </div>
                <button class="checkout-btn">Proceder al Pago</button>
                <a href="products.html" class="continue-shopping">Seguir Comprando</a>
            </div>
        </div>
    </main>

    <script src="js/cart.js"></script>
</body>
</html>
