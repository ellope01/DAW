<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@1..900&display=swap');
    </style>
    <title>Contacto | Intered Servicios de Red</title>

</head>

<body>
    <header>
        <img class="logo" alt="logoInterRed" src="../img/logo.png" />
    </header>


    <h1 class="titulo">Contacta con nosotros</h1>

    <form class="formulario">
        <span class="contactoTitulo">Formulario</span>
        <div class="formularioDiv">
            <div class="formularioSeccion">
                <label class="etiquetaFormulario">Nombre:</label><br>
                <input type="text" placeholder="Introduce tu nombre" class="input" required /><br>
            </div>
            <div class="formularioSeccion">
                <label class="etiquetaFormulario">Email:</label><br>
                <input type="email" placeholder="Introduce tu email" class="input" required /><br>
            </div>
            <div class="formularioSeccion">
                <label class="etiquetaFormulario"> Mensaje:</label>
                <textarea rows="5" placeholder="Introduce tu mensaje" class="input" required></textarea>
            </div>
            <div class="boton">
                <button class="botonFormulario" type="submit">Enviar Formulario</button>
            </div>
        </div>
    </form>

    <section class="infoContacto">
        <h2 class="contactoTitulo">Horario de atención</h2>
        <p class="infoTextoContacto">Lunes a Viernes: 09:00 - 19:00</p>
        <p class="infoTextoContacto">Sabados: 10:00 - 14:00</p>
        <p class="infoTextoContacto">Domingos: Cerrado</p>
    </section>

    <section class="infoContacto">
        <h2 class="contactoTitulo">Dirección</h2>
        <p class="infoTextoContacto">Calle Margarita 152, España</p>
    </section>

    <section class="llamarContacto">
        <div class="divLlamar">
            <p class="infollamar">Llamanos</p>
            <i class="fa-brands fa-whatsapp iconoLlamada"></i>
        </div>
    </section>

    <footer>
        <div class="divTextoFooter">
            <div class="paginas">
                <p>Contactanos</p>
                <p>Especialidades</p>
                <p>Nuestros Valores</p>
            </div>
            <div class="iconoFooter">
                <i class="fa-brands fa-facebook-f iconoLlamada"></i>
                <i class="fa-brands fa-x-twitter iconoLlamada"></i>
                <i class="fa-brands fa-square-youtube iconoLlamada"></i>
            </div>
        </div>

        <div class="textoFooterAbajo">
            <span>2025 © INTERRED Todos los derechos reservados</span>
        </div>

    </footer>
</body>
