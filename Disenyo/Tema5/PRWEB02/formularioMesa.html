<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRWEB02-Alejandria Nosotros</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="icon" type="image/png" href="./sources/img/logo/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./sources/img/logo//favicon.svg" />
    <link rel="shortcut icon" href="./sources/img/logo//favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./sources/img/logo//apple-touch-icon.png" />
    <link rel="manifest" href="./sources/img/logo//site.webmanifest" />
</head>

<body class="bg-[#D9C5A0] w-full">
    <header class="flex flex-row justify-between w-[95%] mx-auto">
        <div>
            <img alt="logo" src="./sources/img/logo.png" class="w-[30%]" />
        </div>
        <div class="flex items-center">
            <p class="text-3xl">Menu</p>
        </div>
    </header>

    <section id="reservarMesas">
        <form>
            <label>Su nombre:</label>
            <input placeholder="Nombre ">
            <br>
            <label>Correo electronico :</label>
            <input placeholder="Correo de confirmación ">
            <br>
            <label>Número de personas:</label>
            <input placeholder="Cuantos ">
            <br>
            <label>Fecha de reserva :</label>
            <input placeholder="Dia ">
            <br>
            <label>Hora preferida:</label>
            <input placeholder="tiempo">
            <button>
                Reservar en Alejandría
            </button>
        </form>

    </section>
</body>
